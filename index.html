<!DOCTYPE html>

<meta charset="utf-8">
<title>Isopod</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>

<canvas id="game"></canvas>
<script>
// =====================================================================
//  SETUP
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Pixel art trick: the game is drawn on a small, low-resolution canvas,
// and the browser blows it up so every game pixel becomes a chunky block.
const PIXEL_SIZE = 3; // each game pixel is about 3x3 screen pixels

function resize() {
  // Round to whole device pixels so every block is exactly the same size
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.max(1, Math.round(PIXEL_SIZE * dpr));
  canvas.width = Math.ceil(innerWidth * dpr / scale);
  canvas.height = Math.ceil(innerHeight * dpr / scale);
  canvas.style.width = canvas.width * scale / dpr + 'px';
  canvas.style.height = canvas.height * scale / dpr + 'px';
}
addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2; // a full circle, in radians

// Turn a colour like '#a1b2c3' (or '#a1b2c380' for see-through) into [red, green, blue, alpha] numbers
function rgb(hex) {
  const n = parseInt(hex.slice(1, 7), 16);
  const alpha = hex.length === 9 ? parseInt(hex.slice(7), 16) : 255;
  return [n >> 16, (n >> 8) & 255, n & 255, alpha];
}

// A 4x4 pattern for "dithering": mixing two colours in a checkered pattern
// to fake the colour in between. A classic pixel-art technique.
const BAYER = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
].map(row => row.map(v => v / 16));

function mod(a, n) {
  return ((a % n) + n) % n;
}

// Rotate an angle a fraction of the way toward a target angle, the short way round
function turnToward(angle, target, amount) {
  const diff = Math.atan2(Math.sin(target - angle), Math.cos(target - angle));
  return angle + diff * Math.min(1, amount);
}

function formatTime(seconds) {
  return Math.floor(seconds / 60) + ':' + String(Math.floor(seconds % 60)).padStart(2, '0');
}

// =====================================================================
//  TUNING: handy numbers to tweak how the game feels
// =====================================================================

const BASE_VISION = 87;         // how far you can see (in game pixels) when healthy
const BODY_RADIUS = 7;          // isopods are treated as circles this big when bumping
const EAT_RADIUS = 9;           // how close you need to be to eat something

const MAX_HEALTH = 100;
const MAX_HUNGER = 100;
const START_HUNGER = 70;
const HUNGER_DRAIN = 1.2;       // hunger lost per second
const STARVE_DAMAGE = 3;        // health lost per second while your hunger is empty
const WELL_FED = 60;            // while hunger is above this...
const HEAL_RATE = 0.8;          // ...you heal this much health per second

const SICK_PER_PLASTIC = 40;    // sickness from one bite of plastic (100 = as sick as it gets)
const SICK_RECOVERY = 2.5;      // sickness that wears off per second
const SICK_VISION_LOSS = 0.5;   // at full sickness you can only see half as far

const FOOD_CHANCE = 0.35;       // chance of a food scrap in each 128x128 patch of seabed
const PLASTIC_CHANCE = 0.3;     // chance of a piece of plastic in each patch

const MAX_RIVALS = 10;          // ...slowly growing to this many

const SPAWN_EVERY = 3;          // seconds between new rivals turning up
const BITE_DAMAGE = 8;
const BITE_COOLDOWN = 0.7;      // seconds you're safe after being bitten
const RIVAL_SMELL = 60;         // rivals go for food that's this close to them
const GIVE_UP_DISTANCE = 450;   // rivals left this far behind wander off

// =====================================================================

// =====================================================================

// =====================================================================
//  PIXEL FONT
//  A tiny 3x5 font so text matches the pixel art. Each character is
//  5 rows of 3 pixels, written as 1 (filled) and 0 (empty).
// =====================================================================
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111',
  0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
  8: '111101111101111', 9: '111101111001110',
  '+': '000010111010000', '-': '000000111000000', ':': '000010000010000', '!': '010010010000010',
  '.': '000000000000010', '/': '001001010100100', ' ': '000000000000000',
};

function drawText(text, x, y, color, scale = 1) {
  ctx.fillStyle = color;
  for (const ch of text.toUpperCase()) {
    const glyph = FONT[ch] || FONT[' '];
    for (let i = 0; i < 15; i++) {
      if (glyph[i] === '1') ctx.fillRect(x + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale);
    }
    x += 4 * scale;
  }
}

// Text with a dark shadow so it's readable on top of anything
function drawLabel(text, x, y, color, scale = 1, centered = false) {
  if (centered) x -= Math.floor((text.length * 4 - 1) * scale / 2);
  drawText(text, x + scale, y + scale, '#04060a', scale);
  drawText(text, x, y, color, scale);
}

// =====================================================================
//  ISOPOD SPRITES
//  Rather than hand-placing every pixel, each kind of isopod is described
//  by a "look" (body shape, colours, legs...). The code paints it pixel by
//  pixel, facing 32 different directions, each with 4 walking frames.
//
//  Positions in a look are measured along the body: u = forward/back
//  from the middle (head is +), v = out to the side.
// =====================================================================
const SPRITE_ANGLES = 32;
const WALK_FRAMES = 4;
const SPRITE_SHADOW = [0, 0, 0, 90];

const PLAYER_LOOK = {
  size: 28,                          // sprite canvas size in pixels
  length: 7, width: 5.5,             // half-length and half-width of the body
  roundness: 2.4,                    // 2 = plain oval, higher = chubbier
  plates: [2.6, 0.2, -2.2, -4.6],    // grooves between armour plates (the first is the neck)
  spikes: 0,                         // how jagged the plate edges are
  legs: 4, legStart: 2.4, legGap: 2.4, legLength: 2.2, legSwing: 0.9, legSpread: 0.8,
  antenna: [[5.6, 1.2], [8.8, 2.8], [10, 2.3]],
  tail: [[-6.2, 1.4], [-8.2, 2.0]],
  eye: { u: 4.4, v: 2.4, big: true },
  blush: { u: 3.4, v: 3.9 },
  shine: true,
  colors: {
    outline: rgb('#2a1d36'), shadow: rgb('#8b78a6'), base: rgb('#b7a4cf'), head: rgb('#b7a4cf'),
    light: rgb('#d5c8e6'), shine: rgb('#f3eefa'), groove: rgb('#9b88b6'), legs: rgb('#6c5a80'),
    eye: rgb('#1b1024'), eyeShine: rgb('#ffffff'), blush: rgb('#f19bb5'),
  },
};

const RIVAL_LOOK = {
  size: 40,
  length: 8.5, width: 4.8,
  roundness: 2.2,
  plates: [5.6, 3.6, 1.6, -0.4, -2.4, -4.4, -6.4],
  spikes: 1.1,
  legs: 7, legStart: 4.6, legGap: 1.8, legLength: 3.4, legSwing: 1.2, legSpread: 2,
  antenna: [[7.2, 1.0], [10.2, 3.2], [12.2, 3.6]],
  tail: [[-7.2, 1.6], [-10.2, 3.2]],
  eye: { u: 6.4, v: 1.7, big: false },
  blush: null,
  shine: false,
  colors: {
    outline: rgb('#17110e'), shadow: rgb('#463730'), base: rgb('#6a5649'), head: rgb('#4f3f37'),
    light: rgb('#86705f'), shine: rgb('#9a8270'), groove: rgb('#54443b'), legs: rgb('#66534a'),
    eye: rgb('#ffd23f'), eyeShine: rgb('#ffd23f'), blush: null,
  },
};

// How wide the body is at point u along it (-1 means "not part of the body")
function bodyHalfWidth(look, u) {
  const t = Math.abs(u) / look.length;
  if (t >= 1) return -1;
  let w = look.width * Math.pow(1 - Math.pow(t, look.roundness), 1 / look.roundness);
  // Jagged edge: each armour plate flares out toward its back corner
  const p = look.plates;
  for (let k = 0; k < p.length - 1; k++) {
    if (u <= p[k] && u > p[k + 1]) {
      const f = (p[k] - u) / (p[k] - p[k + 1]);
      w += look.spikes * f * f;
    }
  }
  return w;
}

// Draw a 1-pixel-wide straight line between two pixels
function drawLine([x0, y0], [x1, y1], color, plot) {
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    plot(x0, y0, color);
    if (x0 === x1 && y0 === y1) return;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function makeIsopodSprite(look, angle, frame) {
  const S = look.size, half = S / 2, C = look.colors;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  // Convert between sprite pixels (x, y) and body positions (u, v)
  const toBody = (x, y) => [(x - half) * cos + (y - half) * sin, -(x - half) * sin + (y - half) * cos];
  const toPoint = (u, v) => [half + u * cos - v * sin, half + u * sin + v * cos];
  const toPixel = (u, v) => toPoint(u, v).map(Math.floor);
  const inBody = (x, y) => { const [u, v] = toBody(x, y); return Math.abs(v) <= bodyHalfWidth(look, u); };

  const px = new Array(S * S).fill(null); // one colour (or null = see-through) per pixel
  const get = (x, y) => (x >= 0 && y >= 0 && x < S && y < S) ? px[y * S + x] : null;
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < S && y < S) px[y * S + x] = c; };
  const setIfEmpty = (x, y, c) => { if (!get(x, y)) set(x, y, c); };

  // 1. The body, lit from the top-left of the screen
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const cx = x + 0.5, cy = y + 0.5;
      if (!inBody(cx, cy)) continue;
      const u = toBody(cx, cy)[0];
      let c = u > look.plates[0] ? C.head : C.base;
      if (!inBody(cx + 1.6, cy + 1.6)) c = C.shadow;                         // edge facing away from the light
      else if (look.plates.some(p => Math.abs(u - p) < 0.45)) c = C.groove;  // gaps between armour plates
      else if (!inBody(cx - 1.2, cy - 1.2)) c = C.light;                     // edge facing the light
      else if (look.shine && Math.hypot(cx - half + 2, cy - half + 2) < 1.3) c = C.shine;
      set(x, y, c);
    }
  }

  // 2. A dark outline hugging the body
  const body = px.slice();
  const solid = (x, y) => x >= 0 && y >= 0 && x < S && y < S && body[y * S + x];
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      if (!body[y * S + x] && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) {
        set(x, y, C.outline);
      }
    }
  }

  // 3. Thin legs, antennae and tail. The legs swing a little each walking frame.
  const step = frame / WALK_FRAMES * TAU;
  const limb = (points, c) => {
    for (let i = 0; i < points.length - 1; i++) drawLine(toPixel(...points[i]), toPixel(...points[i + 1]), c, setIfEmpty);
  };
  for (const side of [-1, 1]) {
    for (let i = 0; i < look.legs; i++) {
      const u = look.legStart - i * look.legGap;
      const w = bodyHalfWidth(look, u);
      const swing = Math.sin(step + i * 1.6 + (side > 0 ? Math.PI : 0)) * look.legSwing;
      const tipU = u + swing + u / look.length * look.legSpread;
      limb([[u, side * (w - 0.5)], [tipU, side * (w + look.legLength)]], C.legs);
    }
    limb(look.antenna.map(([u, v]) => [u, side * v]), C.legs);
    limb(look.tail.map(([u, v]) => [u, side * v]), C.legs);
  }

  // 4. Rosy cheeks (cute only) and eyes: big and shiny, or small and beady
  for (const side of [-1, 1]) {
    if (look.blush) set(...toPixel(look.blush.u, side * look.blush.v), C.blush);
    if (look.eye.big) {
      const [ex, ey] = toPoint(look.eye.u, side * look.eye.v);
      const x0 = Math.round(ex - 1), y0 = Math.round(ey - 1);
      set(x0, y0, C.eyeShine); set(x0 + 1, y0, C.eye);
      set(x0, y0 + 1, C.eye);  set(x0 + 1, y0 + 1, C.eye);
    } else {
      set(...toPixel(look.eye.u, side * look.eye.v), C.eye);
    }
  }

  // 5. A soft shadow on the seabed, down and to the right
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      if (!px[y * S + x] && inBody(x + 0.5 - 2, y + 0.5 - 2.5)) px[y * S + x] = SPRITE_SHADOW;
    }
  }

  // Copy the pixels onto a little canvas we can stamp onto the screen
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = S;
  const sctx = sprite.getContext('2d');
  const img = sctx.createImageData(S, S);
  px.forEach((c, i) => { if (c) img.data.set(c, i * 4); });
  sctx.putImageData(img, 0, 0);
  return sprite;
}

function makeSprites(look) {
  const sprites = [];
  for (let a = 0; a < SPRITE_ANGLES; a++) {
    sprites.push([]);
    for (let f = 0; f < WALK_FRAMES; f++) sprites[a].push(makeIsopodSprite(look, a / SPRITE_ANGLES * TAU, f));
  }
  return sprites;
}

// Pick the pre-drawn sprite closest to the direction it's facing
function pickSprite(sprites, angle, walk) {
  const a = Math.round(mod(angle, TAU) / TAU * SPRITE_ANGLES) % SPRITE_ANGLES;
  return sprites[a][Math.floor(walk) % WALK_FRAMES];
}

const playerSprites = makeSprites(PLAYER_LOOK);
const rivalSprites = makeSprites(RIVAL_LOOK);

// =====================================================================
//  FOOD, PLASTIC AND HUD ICONS
//  Small hand-drawn pixel art: each letter is a colour from the palette
//  underneath it, and '.' is see-through.
// =====================================================================
function pixelArt(rows, colors) {
  const pal = {};
  for (const k in colors) pal[k] = rgb(colors[k]);
  const w = Math.max(...rows.map(r => r.length)) + 1, h = rows.length + 1; // +1 to fit the shadow
  const filled = (x, y) => y >= 0 && y < rows.length && x >= 0 && x < rows[y].length && rows[y][x] !== '.';
  const sprite = document.createElement('canvas');
  sprite.width = w;
  sprite.height = h;
  const sctx = sprite.getContext('2d');
  const img = sctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = filled(x, y) ? pal[rows[y][x]] : filled(x - 1, y - 1) ? SPRITE_SHADOW : null;
      if (c) img.data.set(c, (y * w + x) * 4);
    }
  }
  sctx.putImageData(img, 0, 0);
  return sprite;
}

// =====================================================================
//  ENDLESS SEABED
//  The world is split into square "chunks". A chunk is only created when
//  it comes into view, so the seabed goes on forever. Each chunk is built
//  from a seed, so a spot looks the same when you come back to it.
// =====================================================================
const CHUNK = 128;           // chunk size in game pixels
let SEED = 0;                // picked fresh every game, so every seabed is different
const chunks = new Map();
const eaten = new Set();     // food and plastic that's gone, so it doesn't grow back

// A snack and a bottle cap right in front of you at the start, to show the difference

];

// A repeatable "random" number from 0 to 1 for any whole-number position
function hash(x, y, salt) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(SEED + salt, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Smooth random bumps, used for patches of lighter and darker silt
function smoothNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx);
  fy = fy * fy * (3 - 2 * fy);
  const a = hash(xi, yi, 0), b = hash(xi + 1, yi, 0), c = hash(xi, yi + 1, 0), d = hash(xi + 1, yi + 1, 0);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

// A random number generator that always gives the same sequence for the same seed
function seededRandom(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const HOLE = rgb('#06090d'), HOLE_LIP = rgb('#2c3a49');

  ['#25232a', '#35323a', '#4a4650'],
  ['#2a3138', '#3b444d', '#56616c'],
].map(set => set.map(c => rgb(c)));

function makeChunk(cx, cy) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = CHUNK;
  const c = canvas.getContext('2d');
  const img = c.createImageData(CHUNK, CHUNK);
  const data = img.data;
  const inside = (x, y) => x >= 0 && y >= 0 && x < CHUNK && y < CHUNK;
  const put = (x, y, col) => { if (inside(x, y)) data.set(col, (y * CHUNK + x) * 4); };
  const darken = (x, y, f) => {
    if (!inside(x, y)) return;
    const i = (y * CHUNK + x) * 4;
    data[i] *= f; data[i + 1] *= f; data[i + 2] *= f;
  };

  // Silt: smooth patches of lighter and darker mud, dithered into a few colours
  for (let y = 0; y < CHUNK; y++) {
    for (let x = 0; x < CHUNK; x++) {
      const wx = cx * CHUNK + x, wy = cy * CHUNK + y; // position in the whole world
      let n = 0.65 * smoothNoise(wx / 90, wy / 90) + 0.35 * smoothNoise(wx / 26 + 500, wy / 26 + 500);
      n = Math.min(1, Math.max(0, (n - 0.5) * 1.8 + 0.5));
      const level = Math.min(SILT.length - 1, Math.floor(n * (SILT.length - 1) + BAYER[wy & 3][wx & 3]));
      let col = SILT[level];
      const grain = hash(wx, wy, 1);
      if (grain < 0.012) col = GRAIN_LIGHT;
      else if (grain > 0.994) col = GRAIN_DARK;
      put(x, y, col);
    }
  }

  const rand = seededRandom(Math.floor(hash(cx, cy, 2) * 4294967296));
  const between = (lo, hi) => lo + rand() * (hi - lo);
  const spot = margin => [Math.floor(between(margin, CHUNK - margin)), Math.floor(between(margin, CHUNK - margin))];

  // A stone lit from the top-left, casting a small shadow down-right
  const stone = (x0, y0, r, squash, colors) => {
    const solid = (dx, dy) => dx * dx + (dy * dy) / (squash * squash) <= r * r;
    const R = Math.ceil(r) + 1;
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        if (solid(dx, dy)) {
          let col = colors[1];
          if (!solid(dx + 1, dy + 1)) col = colors[0];
          else if (!solid(dx - 1, dy - 1)) col = colors[2];
          put(x0 + dx, y0 + dy, col);
        } else if (solid(dx - 1, dy - 1)) {
          darken(x0 + dx, y0 + dy, 0.55);
        }
      }
    }
  };

  // A burrow hole dug by some unseen worm, with a little lip of mud
  const hole = (x0, y0) => {
    const open = (dx, dy) => dx * dx / 4 + dy * dy / 1.6 <= 1;
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        if (open(dx, dy)) put(x0 + dx, y0 + dy, HOLE);
        else if (open(dx - 1, dy - 1)) put(x0 + dx, y0 + dy, HOLE_LIP);
      }
    }
  };

  const pickRock = () => ROCKS[Math.floor(rand() * ROCKS.length)];

  if (rand() < 0.3) hole(...spot(6));
  if (rand() < 0.25) { // a little cluster of stones
    const [x, y] = spot(16);
    for (let i = 0; i < 8; i++) {
      stone(x + Math.round(between(-10, 10)), y + Math.round(between(-10, 10)), between(1, 2.5), between(0.65, 1), pickRock());
    }
  }
  const pebbles = 3 + Math.floor(rand() * 6);
  for (let i = 0; i < pebbles; i++) {
    stone(...spot(6), between(1, 3.5), between(0.65, 1), pickRock());
  }
  c.putImageData(img, 0, 0);

  // Food scraps and plastic litter lying around (kept separate from the
  // picture of the seabed, because they can be eaten)
  const items = [];
  let count = 0;
  const place = type => {
    const [x, y] = spot(10);
    const wx = cx * CHUNK + x, wy = cy * CHUNK + y;
    const id = cx + ',' + cy + ',' + count++;
    if (Math.hypot(wx, wy) > 30 && !eaten.has(id)) items.push({ id, type, x: wx, y: wy });
  };
  if (rand() < FOOD_CHANCE) place(pickWeighted(FOOD_KINDS, rand()));
  if (rand() < FOOD_CHANCE * 0.3) place(pickWeighted(FOOD_KINDS, rand()));
  if (rand() < PLASTIC_CHANCE) place(pickWeighted(PLASTIC_KINDS, rand()));
  START_ITEMS.forEach((s, i) => {
    const id = 'start' + i;
    if (Math.floor(s.x / CHUNK) === cx && Math.floor(s.y / CHUNK) === cy && !eaten.has(id)) {
      items.push({ id, type: s.type, x: s.x, y: s.y });
    }
  });

  return { canvas, cx, cy, items };
}

function getChunk(cx, cy) {
  const key = cx + ',' + cy;
  if (!chunks.has(key)) chunks.set(key, makeChunk(cx, cy));
  return chunks.get(key);
}

// Forget chunks far behind you so memory doesn't fill up
function forgetFarChunks() {
  const keep = Math.ceil(Math.max(canvas.width, canvas.height) / CHUNK) + 2;
  if (chunks.size <= (keep * 2 + 1) ** 2) return;
  const pcx = Math.floor(player.x / CHUNK), pcy = Math.floor(player.y / CHUNK);
  for (const [key, ch] of chunks) {
    if (Math.abs(ch.cx - pcx) > keep || Math.abs(ch.cy - pcy) > keep) chunks.delete(key);
  }
}

// =====================================================================
//  DARKNESS
//  A dark layer with a hole around the player. The edge fades out in
//  dithered steps for a pixel-art look, and turns murky green when you're
//  sick. It's only rebuilt when your vision changes.
// =====================================================================
const DARK_STEPS = [0, 0.24, 0.48, 0.72, 0.96]; // see-through ... almost black
let darkMask = null, darkMaskKey = '', darkFill = '';

function getDarkMask() {
  const r = Math.round(visionRadius);
  const tint = Math.round(player.sick / 20) / 5; // 0 = healthy, 1 = very sick
  const key = r + '/' + tint;
  if (key === darkMaskKey) return darkMask;
  const color = [Math.round(14 * tint), Math.round(2 + 30 * tint), Math.round(8 - 2 * tint)];
  const half = r + 1, size = half * 2;
  darkMask = document.createElement('canvas');
  darkMask.width = darkMask.height = size;
  const mctx = darkMask.getContext('2d');
  const img = mctx.createImageData(size, size);
  const inner = r * 0.3; // fully lit inside this
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const d = Math.hypot(x + 0.5 - half, y + 0.5 - half);
      const t = Math.min(1, Math.max(0, (d - inner) / (r - inner)));
      const step = Math.min(DARK_STEPS.length - 1, Math.floor(t * (DARK_STEPS.length - 1) + BAYER[y & 3][x & 3]));
      img.data.set([...color, Math.round(DARK_STEPS[step] * 255)], (y * size + x) * 4);
    }
  }
  mctx.putImageData(img, 0, 0);
  darkFill = `rgba(${color.join(', ')}, ${Math.round(0.96 * 255) / 255})`;
  darkMaskKey = key;
  return darkMask;
}

// =====================================================================
//  GAME STATE
// =====================================================================
const player = { x: 0, y: 0, angle: 0, walk: 0, health: 0, hunger: 0, sick: 0, hurtTimer: 0 };
const rivals = [];
const activeItems = []; // food and plastic near you
const particles = [];   // crumbs when something gets eaten
const floaters = [];    // floating "+12" style messages
const scent = [];       // the smell drifting off food
const CURRENT = { x: 7, y: -4 }; // the gentle current that carries scent along
const SCENT_LIFE = 3;

let visionRadius, state, deathCause, deadTime, time, foodEaten, plasticEaten;
let spawnTimer, shake, displayHealth, hasMoved, hintTimer;
let clock = 0; // keeps ticking even after you die, for animations

function resetGame() {
  SEED = Math.floor(Math.random() * 1e9); // a brand-new seabed
  chunks.clear();
  eaten.clear();
  Object.assign(player, {
    x: 0, y: 0, angle: -Math.PI / 2, walk: 0,
    health: MAX_HEALTH, hunger: START_HUNGER, sick: 0, hurtTimer: 0,
  });
  for (const list of [rivals, activeItems, particles, floaters, scent]) list.length = 0;
  visionRadius = BASE_VISION;
  displayHealth = MAX_HEALTH;
  state = 'playing';
  deathCause = '';
  deadTime = 0;
  time = 0;
  foodEaten = 0;
  plasticEaten = 0;
  spawnTimer = 4; // a calm moment at the start
  shake = 0;
  hasMoved = false;
  hintTimer = 0;
}

function spawnRival() {
  // Appear somewhere in the darkness just beyond what you can see
  const dir = Math.random() * TAU;
  const dist = visionRadius + 30 + Math.random() * 60;
  rivals.push({
    x: player.x + Math.cos(dir) * dist,
    y: player.y + Math.sin(dir) * dist,
    angle: dir + Math.PI,               // facing you
    speed: 28 + Math.random() * 12,     // a bit slower than you
    walk: Math.random() * WALK_FRAMES,
    wander: Math.random() * 100,        // so they don't all weave in sync
    munching: 0,                        // seconds left eating a stolen snack
  });
}

// Push two overlapping bodies apart. `aShare` is how much of the push `a` takes.
function pushApart(a, b, aShare) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy), overlap = BODY_RADIUS * 2 - d;
  if (overlap <= 0 || d === 0) return;
  const nx = dx / d, ny = dy / d;
  a.x -= nx * overlap * aShare;       a.y -= ny * overlap * aShare;
  b.x += nx * overlap * (1 - aShare); b.y += ny * overlap * (1 - aShare);
}

// Collect the food and plastic lying near you (on screen or just off it)
function gatherItems() {
  activeItems.length = 0;
  const rx = Math.ceil(canvas.width / 2 / CHUNK) + 1, ry = Math.ceil(canvas.height / 2 / CHUNK) + 1;
  const pcx = Math.floor(player.x / CHUNK), pcy = Math.floor(player.y / CHUNK);
  for (let gy = pcy - ry; gy <= pcy + ry; gy++) {
    for (let gx = pcx - rx; gx <= pcx + rx; gx++) {
      for (const it of getChunk(gx, gy).items) if (!it.gone) activeItems.push(it);
    }
  }
}

function burst(x, y, colors, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, speed = 15 + Math.random() * 25;
    particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.3 + Math.random() * 0.4, color: colors[i % colors.length] });
  }
}

function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}

function removeItem(it) {
  it.gone = true;
  eaten.add(it.id);
}

function playerEats(it) {
  const kind = ITEMS[it.type];
  removeItem(it);
  burst(it.x, it.y, Object.values(kind.colors), 10);
  if (kind.plastic) {
    player.sick = Math.min(100, player.sick + SICK_PER_PLASTIC);
    plasticEaten++;
    floatText(it.x, it.y - 8, 'BLEH!', '#a6e07c');
  } else {
    player.hunger = Math.min(MAX_HUNGER, player.hunger + kind.food);
    foodEaten++;
    floatText(it.x, it.y - 8, '+' + kind.food, '#ffd27a');
  }
}

function rivalEats(it) {
  removeItem(it);
  burst(it.x, it.y, Object.values(ITEMS[it.type].colors), 6);
  floatText(it.x, it.y - 8, 'NOM', '#b39a88');
}

function hurt(amount, cause, quiet = false) {
  if (state === 'dead') return;
  player.health = Math.max(0, player.health - amount);
  if (!quiet) {
    shake = 0.2;
    floatText(player.x, player.y - 12, '-' + amount, '#ff6b81');
  }
  if (player.health === 0) {
    state = 'dead';
    deathCause = cause;
    deadTime = 0;
  }
}

// "Marine snow": bits of debris drifting down through the water
const snow = [];
for (let i = 0; i < 90; i++) {
  snow.push({
    x: Math.random() * 2000, y: Math.random() * 2000,
    fall: 2 + Math.random() * 5,
    depth: 1.1 + Math.random() * 0.5, // floating above the floor, so it slides past a bit faster
    sway: Math.random() * TAU,
    bright: Math.random() < 0.3,
  });
}

// =====================================================================
//  UPDATE: move everything a tiny step forward in time
// =====================================================================
function update(dt) {
  clock += dt;
  updateEffects(dt);
  if (state === 'dead') {
    deadTime += dt;
    return;
  }
  time += dt;
  gatherItems();

  // --- You ---
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy); // so diagonal movement isn't faster
    player.x += dx / len * PLAYER_SPEED * dt;
    player.y += dy / len * PLAYER_SPEED * dt;
    player.angle = turnToward(player.angle, Math.atan2(dy, dx), dt * 10);
    player.walk += dt * 10;
    hasMoved = true;
  }
  if (hasMoved) hintTimer += dt;

  // --- Hunger, healing and sickness ---
  player.hunger = Math.max(0, player.hunger - HUNGER_DRAIN * dt);
  if (player.hunger === 0) hurt(STARVE_DAMAGE * dt, 'starved', true);
  else if (player.hunger > WELL_FED) player.health = Math.min(MAX_HEALTH, player.health + HEAL_RATE * dt);
  player.sick = Math.max(0, player.sick - SICK_RECOVERY * dt);
  const clearVision = BASE_VISION * (1 - SICK_VISION_LOSS * player.sick / 100);
  visionRadius += (clearVision - visionRadius) * Math.min(1, dt * 3);

  // --- You eat whatever you crawl over (careful!) ---
  for (const it of activeItems) {
    if (!it.gone && Math.hypot(it.x - player.x, it.y - player.y) < EAT_RADIUS) playerEats(it);
  }

  // --- Rival isopods ---
  spawnTimer -= dt;
  const rivalLimit = Math.min(MAX_RIVALS, START_RIVALS + Math.floor(time / MORE_RIVALS_EVERY));
  if (spawnTimer <= 0 && rivals.length < rivalLimit) {
    spawnRival();
    spawnTimer = SPAWN_EVERY;
  }
  for (const r of rivals) {
    if (r.munching > 0) { // busy eating
      r.munching -= dt;
      continue;
    }
    // Go after whichever is closer: you, or a scrap of food they can smell
    let target = player, dist = Math.hypot(player.x - r.x, player.y - r.y);
    for (const it of activeItems) {
      if (it.gone || !ITEMS[it.type].food) continue;
      const d = Math.hypot(it.x - r.x, it.y - r.y);
      if (d < RIVAL_SMELL && d < dist) { target = it; dist = d; }
    }
    if (target !== player && dist < EAT_RADIUS) {
      rivalEats(target);
      r.munching = 1.2;
      continue;
    }
    // Weave a little as if sniffing around (less so up close)
    const weave = Math.sin(clock * 1.3 + r.wander) * Math.min(0.7, dist / 150);
    r.angle = turnToward(r.angle, Math.atan2(target.y - r.y, target.x - r.x) + weave, dt * 3);
    if (target !== player || dist > BODY_RADIUS * 2 + 1) {
      r.x += Math.cos(r.angle) * r.speed * dt;
      r.y += Math.sin(r.angle) * r.speed * dt;
      r.walk += dt * r.speed * 0.25;
    }
  }
  // Bodies can't overlap: rivals nudge each other aside, and you shove through them
  for (let i = 0; i < rivals.length; i++) {
    for (let j = i + 1; j < rivals.length; j++) pushApart(rivals[i], rivals[j], 0.5);
    pushApart(player, rivals[i], 0);
  }
  for (let i = rivals.length - 1; i >= 0; i--) {
    if (Math.hypot(rivals[i].x - player.x, rivals[i].y - player.y) > GIVE_UP_DISTANCE) rivals.splice(i, 1);
  }

  // --- Bites ---
  player.hurtTimer -= dt;
  if (player.hurtTimer <= 0) {
    for (const r of rivals) {
      if (r.munching <= 0 && Math.hypot(r.x - player.x, r.y - player.y) < BODY_RADIUS * 2 + 2) {
        hurt(BITE_DAMAGE, 'bitten');
        player.hurtTimer = BITE_COOLDOWN;
        break;
      }
    }
  }

  // --- Food gives off a scent that drifts with the current ---
  for (const it of activeItems) {
    if (!it.gone && ITEMS[it.type].food && Math.random() < dt * 2.5) {
      scent.push({ x: it.x + Math.random() * 4 - 2, y: it.y + Math.random() * 4 - 2, sway: Math.random() * TAU, life: SCENT_LIFE });
    }
  }
}

// Crumbs, floating text, scent and snow keep moving even after you die
function updateEffects(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 1 - Math.min(1, 4 * dt);
    p.vy *= 1 - Math.min(1, 4 * dt);
    p.life -= dt;
  }
  for (const f of floaters) {
    f.y -= 12 * dt;
    f.life -= dt;
  }
  for (const s of scent) {
    s.x += (CURRENT.x + Math.sin(clock * 2 + s.sway) * 3) * dt;
    s.y += CURRENT.y * dt;
    s.life -= dt;
  }
  for (const list of [particles, floaters, scent]) {
    for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1);
  }
  for (const s of snow) {
    s.y += s.fall * dt;
    s.x += Math.sin(clock * 0.8 + s.sway) * 2 * dt;
  }
  shake = Math.max(0, shake - dt);
  // The white "just lost" part of the health bar catches up after a moment
  displayHealth = displayHealth > player.health ? Math.max(player.health, displayHealth - 25 * dt) : player.health;
}

// =====================================================================
//  DRAW: paint the screen
// =====================================================================
function drawBar(x, y, value, max, [color, shine], warn, ghost = 0) {
  const w = 50, h = 4;
  ctx.fillStyle = '#04060a';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = warn && Math.floor(clock * 4) % 2 === 0 ? '#6a1a28' : '#1b2330'; // flashes red when low
  ctx.fillRect(x, y, w, h);
  if (ghost > value) {
    ctx.fillStyle = '#e8eef4';
    ctx.fillRect(x, y, Math.round(w * ghost / max), h);
  }
  const fill = Math.round(w * value / max);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, fill, h);
  ctx.fillStyle = shine;
  ctx.fillRect(x, y, fill, 1);
}

function drawHUD(W) {
  ctx.drawImage(ICONS.heart, 4, 4);
  drawBar(14, 5, player.health, MAX_HEALTH, ['#e84a64', '#ff9aab'], player.health < MAX_HEALTH * 0.25, displayHealth);
  ctx.drawImage(ICONS.fish, 3, 13);
  drawBar(14, 14, player.hunger, MAX_HUNGER, ['#f2a33a', '#ffd27a'], player.hunger < MAX_HUNGER * 0.2);
  if (player.sick > 0) {
    ctx.drawImage(ICONS.skull, 4, 21);
    drawBar(14, 23, player.sick, 100, ['#6fbf4a', '#b8ec98'], false);
  }
  drawLabel(formatTime(time), Math.floor(W / 2), 4, '#dfe8f0', 1, true);
}

function draw() {
  const W = canvas.width, H = canvas.height;
  // The camera keeps you in the middle of the screen (and shakes when you're bitten)
  let camX = Math.round(player.x) - Math.floor(W / 2), camY = Math.round(player.y) - Math.floor(H / 2);
  if (shake > 0) {
    camX += Math.round(Math.random() * 4 - 2);
    camY += Math.round(Math.random() * 4 - 2);
  }
  const px = Math.round(player.x) - camX, py = Math.round(player.y) - camY; // you, on screen

  // Seabed: every chunk that's on screen
  for (let gy = Math.floor(camY / CHUNK); gy <= Math.floor((camY + H) / CHUNK); gy++) {
    for (let gx = Math.floor(camX / CHUNK); gx <= Math.floor((camX + W) / CHUNK); gx++) {
      ctx.drawImage(getChunk(gx, gy).canvas, gx * CHUNK - camX, gy * CHUNK - camY);
    }
  }
  forgetFarChunks();

  // Food and plastic
  for (const it of activeItems) {
    if (it.gone) continue;
    const s = ITEMS[it.type].sprite;
    ctx.drawImage(s, Math.round(it.x) - camX - ((s.width - 1) >> 1), Math.round(it.y) - camY - ((s.height - 1) >> 1));
  }

  // Crumbs
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x) - camX, Math.round(p.y) - camY, 1, 1);
  }

  // Rivals, then you on top (blinking for a moment after a bite)
  for (const r of rivals) {
    const s = pickSprite(rivalSprites, r.angle, r.walk);
    ctx.drawImage(s, Math.round(r.x) - camX - s.width / 2, Math.round(r.y) - camY - s.height / 2);
  }
  const blinking = state === 'playing' && player.hurtTimer > 0 && Math.floor(player.hurtTimer * 15) % 2 === 1;
  if (!blinking) {
    const ps = pickSprite(playerSprites, player.angle, player.walk);
    ctx.drawImage(ps, px - ps.width / 2, py - ps.height / 2);
  }

  // Marine snow
  for (const s of snow) {
    ctx.fillStyle = s.bright ? 'rgba(225, 238, 248, 0.7)' : 'rgba(200, 220, 235, 0.35)';
    ctx.fillRect(mod(Math.round(s.x - camX * s.depth), W), mod(Math.round(s.y - camY * s.depth), H), 1, 1);
  }

  // Darkness: you can only see a circle around yourself
  const mask = getDarkMask();
  const mx = px - mask.width / 2, my = py - mask.height / 2;
  ctx.drawImage(mask, mx, my);
  ctx.fillStyle = darkFill;
  ctx.fillRect(0, 0, W, my);                                           // above the circle
  ctx.fillRect(0, my + mask.height, W, H - my - mask.height);          // below
  ctx.fillRect(0, my, mx, mask.height);                                // left
  ctx.fillRect(mx + mask.width, my, W - mx - mask.width, mask.height); // right

  // Scent drifting off food: you can smell it before you can see it
  for (const s of scent) {
    const alpha = 0.45 * Math.min(1, s.life / 1.5, (SCENT_LIFE - s.life) * 2);
    ctx.fillStyle = `rgba(214, 232, 150, ${alpha})`;
    ctx.fillRect(Math.round(s.x) - camX, Math.round(s.y) - camY, 1, 1);
  }

  // Floating "+12", "BLEH!" and so on
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 3);
    drawLabel(f.text, Math.round(f.x) - camX, Math.round(f.y) - camY, f.color, 1, true);
  }
  ctx.globalAlpha = 1;

  drawHUD(W);

  const cx = Math.floor(W / 2), cy = Math.floor(H / 2);
  if (state === 'playing') {
    // How-to-play hint, fading away once you've been crawling a while
    const alpha = hasMoved ? Math.max(0, Math.min(1, 1 - (hintTimer - 6) / 2)) : 1;
    if (alpha > 0) {
      ctx.globalAlpha = alpha;
      drawLabel('WASD / ARROW KEYS TO CRAWL', cx, H - 24, '#c9d6e3', 1, true);
      drawLabel('EAT SCRAPS. AVOID PLASTIC!', cx, H - 15, '#c9d6e3', 1, true);
      ctx.globalAlpha = 1;
    }
  } else {
    // Game over
    ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.6, deadTime)})`;
    ctx.fillRect(0, 0, W, H);
    const title = deathCause === 'starved' ? 'YOU STARVED' : 'THE RIVALS GOT YOU';
    drawLabel(title, cx, cy - 34, '#ff8a9c', 2, true);
    drawLabel('SURVIVED ' + formatTime(time), cx, cy - 12, '#dfe8f0', 1, true);
    drawLabel('ATE ' + foodEaten + ' SCRAPS AND ' + plasticEaten + ' PLASTIC', cx, cy - 4, '#dfe8f0', 1, true);
    if (deadTime > 0.8 && Math.floor(clock * 2) % 2 === 0) {
      drawLabel('PRESS SPACE TO TRY AGAIN', cx, cy + 14, '#ffffff', 1, true);
    }
  }
}

// =====================================================================
//  THE GAME LOOP: update, draw, repeat ~60 times per second
// =====================================================================
resetGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); // seconds since the last frame
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
